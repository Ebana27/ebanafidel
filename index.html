<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold text-gray-800">Nom de la Société</h1>
            <nav class="mt-4">
                <ul class="flex space-x-4">
                    <li><a href="#" class="text-gray-600 hover:text-blue-500">Accueil</a></li>
                    <li><a href="#" class="text-gray-600 hover:text-blue-500">Services</a></li>
                    <li><a href="#" class="text-gray-600 hover:text-blue-500">À propos</a></li>
                    <li><a href="#" class="text-gray-600 hover:text-blue-500">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="flex flex-col items-center justify-center min-h-screen">
        <section class="text-center">
            <h2 class="text-4xl font-semibold text-gray-800">Bienvenue sur notre site</h2>
            <p class="mt-4 text-gray-600">Nous offrons les meilleurs services pour vous aider à réussir.</p>
            <a href="#" class="mt-6 inline-block bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Commencez maintenant</a>
        </section>
    </main>

    <footer class="bg-white shadow mt-10">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <p class="text-center text-gray-600">&copy; 2025 Nom de la Société. Tous droits réservés.</p>
        </div>
    </footer>

</body>
</html>
